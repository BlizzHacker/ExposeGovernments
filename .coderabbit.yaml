# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct; skip praise and preamble. This is a public-records journalism
  site. Prioritize factual accuracy, source attribution, and avoiding exposure
  of personal information over style.
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  slop_detection:
    enabled: true
    label: slop

  path_filters:
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/vendor/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/*.{html,md}"
      instructions: >-
        This is published journalism about real people and institutions, so
        errors here are reputational and legal, not cosmetic.

        Flag any factual claim about a named person or organization that is
        stated without a linked or cited source, and any wording that asserts
        wrongdoing as established fact where the underlying record shows only an
        allegation, a filing, or a complaint.

        Flag personal information that is not necessary to the story — home
        addresses, personal phone numbers, government ID numbers, or family
        members of private individuals — even when it appears in a public
        record.

        Check that attribution to a specific agency or company is actually
        supported by the cited document; misattributing an action to the wrong
        entity is a recurring hazard in this material.
    - path: ".github/workflows/**"
      instructions: >-
        Check for unpinned third-party actions, secrets exposed to
        pull_request_target, and steps interpolating untrusted PR text into run
        blocks.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames:
      - dependabot
      - dependabot[bot]

  tools:
    gitleaks:
      enabled: true
    presidio:
      enabled: true
    markdownlint:
      enabled: true
    htmlhint:
      enabled: true
    languagetool:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
