server {
    listen 80 default_server;
    server_name exposemiamiok.com www.exposemiamiok.com localhost;
    root /var/www/exposemiamiok/html;
    index index.html index.php;

    location = /admin { return 301 /admin.html$is_args$args; }
    location = /mayor-watch { return 301 /mayor-watch.html; }

    # Mayor Watch public data is redacted. Raw Facebook scrape is admin-only via /api/evidence/.
    location = /api/mayor-watch/mayor-watch-feed.json {
        alias /opt/facebook-scrape/mayor-watch-public.json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=300";
    }
    location /api/mayor-watch/ { return 404; }

    # Court search API proxy
    location /api/court/ {
        proxy_pass http://127.0.0.1:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static API JSON files (BEFORE proxy blocks)
    location = /api/videos.json { try_files /api/videos.json =404; }
    location = /api/youtube-videos.json { try_files /api/youtube-videos.json =404; }
    location = /api/foia-queue.json { try_files /api/foia-queue.json =404; }
    location = /api/foia-wishlist.json { try_files /api/foia-wishlist.json =404; }
    location = /api/foia-sent.json { try_files /api/foia-sent.json =404; }

    # Evidence API (admin token required - private)
    location /api/evidence/ {
        proxy_pass http://127.0.0.1:5070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # BLOCK public access to old evidence paths
    location /evidence { return 403; }
    location /evidence-archive.html { return 301 /admin; }
    location /facebook-posts/ { return 301 /facebook-archive.html; }

    # FOIA API proxy
    location /api/foia/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Comment API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /foia/admin { return 301 /foia/admin.html$is_args$args; }
    location = /foia { return 301 /foia/; }

    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; }
    location ~ /\.ht { deny all; }
}
