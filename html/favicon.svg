<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Move Weight Foundation">
  <!-- Every page has referenced /favicon.svg since the template was written and
       nothing ever shipped one, so all 14 chapters served a 404 on every load.
       Accent is substituted per chapter, so each state's tab icon matches its
       site. -->
  <rect width="64" height="64" rx="13" fill="#dc2626"/>
  <!-- A document with a corner turned: the thing every chapter exists to get
       hold of. -->
  <path d="M20 13h16l10 10v28a3 3 0 0 1-3 3H20a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z"
        fill="#fff" opacity=".95"/>
  <path d="M36 13v8a2 2 0 0 0 2 2h8z" fill="#dc2626" opacity=".45"/>
  <g fill="#dc2626" opacity=".8">
    <rect x="23" y="30" width="18" height="3" rx="1.5"/>
    <rect x="23" y="37" width="18" height="3" rx="1.5"/>
    <rect x="23" y="44" width="11" height="3" rx="1.5"/>
  </g>
</svg>
