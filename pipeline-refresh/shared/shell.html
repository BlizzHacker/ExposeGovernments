<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="description" content="{description}">
<link rel="canonical" href="{canonical}">
<meta name="theme-color" content="#0c0f14">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{site_name}">
<meta property="og:title" content="{og_title}">
<meta property="og:description" content="{description}">
<meta property="og:url" content="{canonical}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/theme.css?v={css_version}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="author" content="Move Weight Foundation">
<script type="application/ld+json">
{{
  "@context": "https://schema.org",
  "@type": "NewsMediaOrganization",
  "name": "{site_name}",
  "url": "https://{canonical_host}/",
  "description": "{description}",
  "parentOrganization": {{
    "@type": "NGO",
    "name": "Move Weight Foundation",
    "url": "https://foundation.moveweight.com",
    "nonprofitStatus": "Nonprofit501c3"
  }},
  "areaServed": {{ "@type": "AdministrativeArea", "name": "{city}, {state}" }},
  "ethicsPolicy": "https://{canonical_host}/about.html#sources"
}}
</script>
{extra_head}</head>
<body>
<a class="skip" href="#main">Skip to content</a>

{chapter_bar}

<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="/">
      <span class="lo-1">{logo_prefix}</span><span class="lo-2">{logo_body}</span><span class="lo-tld">.com</span>
    </a>
    <button class="navtoggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
        {nav}
    </nav>
  </div>
</header>

{donate_banner}

<main id="main">
{content}
</main>

<footer>
  <div class="wrap">
    <div class="foot-grid">
        {footer_cols}
    </div>
    <div class="foot-bottom">
      <div>{footer_disclaimer}</div>
      <div>
        <a href="/about.html">About</a> &middot;
        <a href="https://foundation.moveweight.com/privacy">Privacy</a> &middot;
        <a href="https://foundation.moveweight.com/terms">Terms</a>
      </div>
    </div>
  </div>
</footer>

<script>
(function () {{
  var btn = document.querySelector('.navtoggle');
  var nav = document.getElementById('nav');
  if (btn && nav) {{
    btn.addEventListener('click', function () {{
      var open = nav.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }});
  }}
}})();
</script>
{extra_body}</body>
</html>
